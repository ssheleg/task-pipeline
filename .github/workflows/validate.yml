name: validate

on:
  push:
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the tag-ancestry check below needs history, not a shallow clone

      # A release that lives only on a tag is invisible from inside either record.
      # v1.4.4 was tagged, released and published with a manifest field that `main`
      # never received; every later branch was cut from a tree that had not seen it,
      # and v1.6.0 silently shipped without it. main was consistent with itself, the
      # tag was consistent with itself, CI was green on both — the disagreement only
      # existed BETWEEN them, which is the same shape as the parent/submodule pointer
      # this project's own stage-10 doctrine guards against. So: every released tag
      # must be reachable from main.
      - name: Every v* tag must be contained in main
        run: |
          set -eu
          git fetch --tags --quiet
          git fetch --quiet origin main:refs/remotes/origin/main || true
          orphans=""
          for t in $(git tag --list 'v*'); do
            if ! git merge-base --is-ancestor "$t" origin/main 2>/dev/null; then
              orphans="$orphans $t"
            fi
          done
          if [ -n "$orphans" ]; then
            echo "ERROR: released tag(s) not contained in main:$orphans"
            echo "A tag outside main is a release nobody can branch from — its changes"
            echo "vanish from the next version while the registry still serves them."
            echo "Fix: merge or cherry-pick the tagged commit into main, then re-tag."
            exit 1
          fi
          echo "OK: every v* tag is an ancestor of main"

      - name: Install jsonschema (enables full pipeline.example.json conformance pass)
        run: python3 -m pip install --quiet jsonschema

      - name: Structural validator
        run: python3 test/validate.py

      - name: Negative self-test (validator must be able to fail)
        run: |
          set -eu
          cp -R . /tmp/corrupt-copy
          # corrupt the version so marketplace/plugin/CHANGELOG drift
          python3 - <<'EOF'
          import re
          p = "/tmp/corrupt-copy/plugins/task-pipeline/.claude-plugin/plugin.json"
          t = open(p, encoding="utf-8").read()
          open(p, "w", encoding="utf-8").write(
              re.sub(r'"version": "[0-9.]*"', '"version": "0.0.0-corrupt"', t))
          EOF
          if python3 /tmp/corrupt-copy/test/validate.py; then
            echo "ERROR: validator passed on a corrupted copy — it cannot fail"
            exit 1
          else
            echo "OK: validator correctly FAILs on corrupted copy"
          fi

      - name: Negative self-test (bad gate type in pipeline.example.json must fail)
        run: |
          set -eu
          cp -R . /tmp/gate-copy
          python3 - <<'EOF'
          p = "/tmp/gate-copy/plugins/task-pipeline/skills/task-pipeline/pipeline.example.json"
          t = open(p, encoding="utf-8").read()
          open(p, "w", encoding="utf-8").write(t.replace('"type": "auto"', '"type": "sometimes"'))
          EOF
          if python3 /tmp/gate-copy/test/validate.py; then
            echo "ERROR: validator passed an invalid gate.type"
            exit 1
          else
            echo "OK: validator rejects an invalid gate.type"
          fi

      - name: Negative self-test (release.enabled true but workflow missing must fail)
        run: |
          set -eu
          cp -R . /tmp/rel-copy
          rm -f /tmp/rel-copy/.github/workflows/release.yml
          if python3 /tmp/rel-copy/test/validate.py; then
            echo "ERROR: validator passed with release.enabled true but no release.yml"
            exit 1
          else
            echo "OK: validator requires the release workflow when release is enabled"
          fi

      - name: Negative self-test (hardcoded vendor model id must fail)
        run: |
          set -eu
          cp -R . /tmp/model-copy
          printf '\nSwitch with `/model claude-opus-5` first.\n' \
            >> /tmp/model-copy/plugins/task-pipeline/skills/task-pipeline/SKILL.md
          if python3 /tmp/model-copy/test/validate.py; then
            echo "ERROR: validator passed a hardcoded model id — ids go stale, the tier is the contract"
            exit 1
          else
            echo "OK: validator rejects a hardcoded model id"
          fi

      - name: Negative self-test (non-token stage model must fail)
        run: |
          set -eu
          cp -R . /tmp/token-copy
          python3 - <<'EOF'
          import json, collections
          p = "/tmp/token-copy/plugins/task-pipeline/skills/task-pipeline/pipeline.example.json"
          d = json.load(open(p), object_pairs_hook=collections.OrderedDict)
          d["stages"][0]["model"] = "some-vendor-model"
          json.dump(d, open(p, "w"), indent=2, ensure_ascii=False)
          EOF
          if python3 /tmp/token-copy/test/validate.py; then
            echo "ERROR: validator passed a stage model that is not a provider-agnostic token"
            exit 1
          else
            echo "OK: validator requires provider-agnostic stage model tokens"
          fi

      - name: Negative self-test (intake grill must stay mandatory + manual)
        run: |
          set -eu
          cp -R . /tmp/grill-copy
          python3 - <<'EOF'
          import json, collections
          p = "/tmp/grill-copy/plugins/task-pipeline/skills/task-pipeline/pipeline.example.json"
          d = json.load(open(p), object_pairs_hook=collections.OrderedDict)
          d["stages"][0]["gate"]["type"] = "auto"
          json.dump(d, open(p, "w"), indent=2, ensure_ascii=False)
          EOF
          if python3 /tmp/grill-copy/test/validate.py; then
            echo "ERROR: validator passed a non-manual intake-grill gate"
            exit 1
          else
            echo "OK: validator keeps the intake grill mandatory and operator-confirmed"
          fi

      - name: Negative self-test (brief template must keep the autonomy sweep)
        run: |
          set -eu
          cp -R . /tmp/brief-copy
          python3 - <<'EOF'
          import re
          p = "/tmp/brief-copy/plugins/task-pipeline/skills/task-pipeline/templates/brief.md"
          t = open(p, encoding="utf-8").read()
          open(p, "w", encoding="utf-8").write(re.sub(r"^## Autonomy.*", "## Notes", t, flags=re.M))
          EOF
          if python3 /tmp/brief-copy/test/validate.py; then
            echo "ERROR: validator passed a brief template with no autonomy sweep"
            exit 1
          else
            echo "OK: validator requires the autonomy sweep in the brief template"
          fi

      - name: Negative self-test (the grill doctrine must ship with the skill)
        run: |
          set -eu
          cp -R . /tmp/doctrine-copy
          rm -f /tmp/doctrine-copy/plugins/task-pipeline/skills/task-pipeline/references/grill.md
          if python3 /tmp/doctrine-copy/test/validate.py; then
            echo "ERROR: validator passed without the built-in grill doctrine"
            exit 1
          else
            echo "OK: validator requires references/grill.md — the grill is built in, not a dependency"
          fi

      - name: Negative self-test (a real broken link still fails past the fence stripper)
        run: |
          set -eu
          cp -R . /tmp/link-copy
          printf '\n[gone](./does-not-exist.md)\n' >> /tmp/link-copy/README.md
          if python3 /tmp/link-copy/test/validate.py; then
            echo "ERROR: validator missed a broken relative link outside a code fence"
            exit 1
          else
            echo "OK: validator still catches broken links outside fences"
          fi

      - name: Negative self-test (the REQ spine must stay in the brief template)
        run: |
          set -eu
          cp -R . /tmp/req-copy
          python3 - <<'EOF'
          import re
          p = "/tmp/req-copy/plugins/task-pipeline/skills/task-pipeline/templates/brief.md"
          t = open(p, encoding="utf-8").read()
          open(p, "w", encoding="utf-8").write(re.sub(r"^## Requirements.*", "## Notes", t, flags=re.M))
          EOF
          if python3 /tmp/req-copy/test/validate.py; then
            echo "ERROR: validator passed a brief template with no REQ spine"
            exit 1
          else
            echo "OK: validator requires the REQ spine in the brief template"
          fi

      - name: Negative self-test (REQ rows must name how they are verified)
        run: |
          set -eu
          cp -R . /tmp/verify-copy
          python3 - <<'EOF'
          p = "/tmp/verify-copy/plugins/task-pipeline/skills/task-pipeline/templates/brief.md"
          t = open(p, encoding="utf-8").read()
          open(p, "w", encoding="utf-8").write(t.replace("How it's verified", "Notes"))
          EOF
          if python3 /tmp/verify-copy/test/validate.py; then
            echo "ERROR: validator passed a REQ table with no verification column"
            exit 1
          else
            echo "OK: validator requires a named check per requirement"
          fi

      - name: Negative self-test (acceptance must close the flow, manually, with evidence)
        run: |
          set -eu
          cp -R . /tmp/acc-copy
          python3 - <<'EOF'
          import json, collections
          p = "/tmp/acc-copy/plugins/task-pipeline/skills/task-pipeline/pipeline.example.json"
          d = json.load(open(p), object_pairs_hook=collections.OrderedDict)
          d["stages"][-1]["gate"]["type"] = "auto"
          json.dump(d, open(p, "w"), indent=2, ensure_ascii=False)
          EOF
          if python3 /tmp/acc-copy/test/validate.py; then
            echo "ERROR: validator passed a non-manual acceptance gate"
            exit 1
          else
            echo "OK: validator keeps acceptance manual — only the asker can confirm"
          fi

      - name: Negative self-test (the plan gate must be a set comparison)
        run: |
          set -eu
          cp -R . /tmp/seam-copy
          python3 - <<'EOF'
          import json, collections
          p = "/tmp/seam-copy/plugins/task-pipeline/skills/task-pipeline/pipeline.example.json"
          d = json.load(open(p), object_pairs_hook=collections.OrderedDict)
          for st in d["stages"]:
              if st.get("state") == "plan":
                  st["gate"]["check"] = "every spec requirement maps to a task"
          json.dump(d, open(p, "w"), indent=2, ensure_ascii=False)
          EOF
          if python3 /tmp/seam-copy/test/validate.py; then
            echo "ERROR: validator passed a plan gate with no REQ set comparison"
            exit 1
          else
            echo "OK: validator requires set equality at the brief-to-plan seam"
          fi

      - name: Negative self-test (the brief must keep the knowledge-source ledger)
        run: |
          set -eu
          cp -R . /tmp/ledger-copy
          python3 - <<'EOF'
          import re
          p = "/tmp/ledger-copy/plugins/task-pipeline/skills/task-pipeline/templates/brief.md"
          t = open(p, encoding="utf-8").read()
          open(p, "w", encoding="utf-8").write(re.sub(r"^## Knowledge sources.*", "## Notes", t, flags=re.M))
          EOF
          if python3 /tmp/ledger-copy/test/validate.py; then
            echo "ERROR: validator passed a brief template with nowhere to record the harvest"
            exit 1
          else
            echo "OK: validator requires the stage-0 source ledger in the brief template"
          fi

      - name: Negative self-test (stage 0 must harvest before it interviews)
        run: |
          set -eu
          cp -R . /tmp/harvest-copy
          python3 - <<'EOF'
          import json, collections
          p = "/tmp/harvest-copy/plugins/task-pipeline/skills/task-pipeline/pipeline.example.json"
          d = json.load(open(p), object_pairs_hook=collections.OrderedDict)
          d["stages"][0]["gate"]["check"] = "MANDATORY stage — never skipped. One question at a time; the brief is confirmed."
          json.dump(d, open(p, "w"), indent=2, ensure_ascii=False)
          EOF
          if python3 /tmp/harvest-copy/test/validate.py; then
            echo "ERROR: validator passed a stage-0 gate with no knowledge harvest"
            exit 1
          else
            echo "OK: validator requires the phase-1 harvest and its ledger before the interview"
          fi

      - name: Negative self-test (stage 9 must close the loop on the ledger)
        run: |
          set -eu
          cp -R . /tmp/loopback-copy
          python3 - <<'EOF'
          import json, collections
          p = "/tmp/loopback-copy/plugins/task-pipeline/skills/task-pipeline/pipeline.example.json"
          d = json.load(open(p), object_pairs_hook=collections.OrderedDict)
          for s in d["stages"]:
              if s.get("state") == "docs-wiki":
                  s["gate"]["check"] = "docs in sync with code; wiki synced; dangling links fixed"
          json.dump(d, open(p, "w"), indent=2, ensure_ascii=False)
          EOF
          if python3 /tmp/loopback-copy/test/validate.py; then
            echo "ERROR: validator passed a docs stage that never updates what stage 0 read"
            exit 1
          else
            echo "OK: validator keeps the harvest→update loop closed"
          fi

      - name: Negative self-test (a description that drops the final stage must fail)
        run: |
          set -eu
          cp -R . /tmp/blurb-copy
          python3 - <<'EOF'
          import json
          p = "/tmp/blurb-copy/package.json"
          d = json.load(open(p))
          d["description"] = d["description"].replace(", acceptance)", ")")
          json.dump(d, open(p, "w"), indent=2, ensure_ascii=False)
          EOF
          if python3 /tmp/blurb-copy/test/validate.py; then
            echo "ERROR: validator passed a description that stops one stage short"
            exit 1
          else
            echo "OK: validator requires every description to name the flow's final stage"
          fi

      - name: Negative self-test (verdict count must not drift from the dev gate)
        run: |
          set -eu
          cp -R . /tmp/verdict-copy
          python3 - <<'EOF'
          p = "/tmp/verdict-copy/plugins/task-pipeline/skills/task-pipeline/references/build.md"
          t = open(p, encoding="utf-8").read()
          open(p, "w", encoding="utf-8").write(t.replace("with **all three** verdicts", "with **both** verdicts"))
          EOF
          if python3 /tmp/verdict-copy/test/validate.py; then
            echo "ERROR: validator passed 'both verdicts' while the dev gate declares three"
            exit 1
          else
            echo "OK: validator keeps the review verdict count consistent across surfaces"
          fi

      - name: Negative self-test (a doctrine file's gate type must match the config)
        run: |
          set -eu
          cp -R . /tmp/doctrinegate-copy
          python3 - <<'EOF'
          import re
          p = "/tmp/doctrinegate-copy/plugins/task-pipeline/skills/task-pipeline/references/acceptance.md"
          t = open(p, encoding="utf-8").read()
          open(p, "w", encoding="utf-8").write(re.sub(r"^## GATE \(manual\)", "## GATE (auto)", t, flags=re.M))
          EOF
          if python3 /tmp/doctrinegate-copy/test/validate.py; then
            echo "ERROR: validator passed a doctrine gate type contradicting pipeline.example.json"
            exit 1
          else
            echo "OK: validator keeps each stage doctrine's gate type in sync with the config"
          fi

      - name: Negative self-test (a stage-10 close-out rule must reach the surfaces that enforce it)
        run: |
          set -eu
          cp -R . /tmp/closeout-copy
          python3 - <<'EOF'
          import re
          p = "/tmp/closeout-copy/plugins/task-pipeline/skills/task-pipeline/references/acceptance.md"
          t = open(p, encoding="utf-8").read()
          open(p, "w", encoding="utf-8").write(re.sub(r"submodule", "sub-module", t, flags=re.I))
          EOF
          if python3 /tmp/closeout-copy/test/validate.py; then
            echo "ERROR: validator passed a close-out rule declared in SKILL.md but absent from the gate that enforces it"
            exit 1
          else
            echo "OK: validator keeps the stage-10 close-out on every surface that defines it"
          fi

      - name: Negative self-test (intake must settle the Figma design destination)
        run: |
          set -eu
          cp -R . /tmp/dest-copy
          python3 - <<'EOF'
          import json, collections, re
          p = "/tmp/dest-copy/plugins/task-pipeline/skills/task-pipeline/pipeline.example.json"
          d = json.load(open(p), object_pairs_hook=collections.OrderedDict)
          c = d["stages"][0]["gate"]["check"]
          d["stages"][0]["gate"]["check"] = re.sub(
              r"; plus, with Figma on, the DESIGN DESTINATION.*?replacement\)", ")", c, flags=re.S)
          json.dump(d, open(p, "w"), indent=2, ensure_ascii=False)
          EOF
          if python3 /tmp/dest-copy/test/validate.py; then
            echo "ERROR: validator passed an intake gate that never settles which Figma file, in which team"
            exit 1
          else
            echo "OK: validator requires the design destination at intake — a duplicate design file is silent"
          fi

      - name: Negative self-test (the autonomy sweep must not drift between its two homes)
        run: |
          set -eu
          cp -R . /tmp/sweep-copy
          python3 - <<'EOF'
          p = "/tmp/sweep-copy/plugins/task-pipeline/skills/task-pipeline/templates/brief.md"
          t = open(p, encoding="utf-8").read()
          t = "\n".join(l for l in t.splitlines() if not l.startswith("| 8 Post-deploy"))
          open(p, "w", encoding="utf-8").write(t + "\n")
          EOF
          if python3 /tmp/sweep-copy/test/validate.py; then
            echo "ERROR: validator passed a brief template whose sweep drops a stage the grill asks about"
            exit 1
          else
            echo "OK: validator keeps grill.md's sweep and brief.md's sweep covering the same stages"
          fi

      - name: Negative self-test (acceptance must walk the ladder before the table)
        run: |
          set -eu
          cp -R . /tmp/ladder-copy
          python3 - <<'EOF'
          import json, collections
          p = "/tmp/ladder-copy/plugins/task-pipeline/skills/task-pipeline/pipeline.example.json"
          d = json.load(open(p), object_pairs_hook=collections.OrderedDict)
          d["stages"][-1]["gate"]["check"] = (
              "every REQ has a status; every verified carries evidence; the operator signs off"
          )
          json.dump(d, open(p, "w"), indent=2, ensure_ascii=False)
          EOF
          if python3 /tmp/ladder-copy/test/validate.py; then
            echo "ERROR: validator passed an acceptance gate that only compares the REQ list — an absence has one side"
            exit 1
          else
            echo "OK: validator requires the ladder walk before the coverage table"
          fi

      - name: Negative self-test (the audit doctrine must ship with the skill)
        run: |
          set -eu
          cp -R . /tmp/audit-copy
          rm -f /tmp/audit-copy/plugins/task-pipeline/skills/task-pipeline/references/audit.md
          if python3 /tmp/audit-copy/test/validate.py; then
            echo "ERROR: validator passed without the built-in audit doctrine"
            exit 1
          else
            echo "OK: validator requires references/audit.md"
          fi

      - name: Negative self-test (the open-source surface must stay present)
        run: |
          set -eu
          cp -R . /tmp/oss-copy
          rm -f /tmp/oss-copy/CONTRIBUTING.md
          if python3 /tmp/oss-copy/test/validate.py; then
            echo "ERROR: validator passed a repo with no CONTRIBUTING.md"
            exit 1
          else
            echo "OK: validator requires the open-source root files"
          fi

      - name: Negative self-test (npm test must run the validator)
        run: |
          set -eu
          cp -R . /tmp/script-copy
          python3 - <<'EOF'
          import json
          p = "/tmp/script-copy/package.json"
          d = json.load(open(p))
          d["scripts"] = {"test": "echo ok"}
          json.dump(d, open(p, "w"), indent=2, ensure_ascii=False)
          EOF
          if python3 /tmp/script-copy/test/validate.py; then
            echo "ERROR: validator passed a package.json whose test script skips the validator"
            exit 1
          else
            echo "OK: validator requires npm test to run test/validate.py"
          fi

      - name: Negative self-test (the negative self-tests must stay runnable off CI)
        run: |
          set -eu
          cp -R . /tmp/portable-copy
          python3 - <<'EOF'
          # build the forbidden token at runtime — spelling it literally here would
          # make this very file trip the guard it is testing
          bad = "s" + "ed -i"
          p = "/tmp/portable-copy/.github/workflows/validate.yml"
          t = open(p, encoding="utf-8").read()
          open(p, "w", encoding="utf-8").write(
              t + f"\n      - name: stray\n        run: |\n          {bad} 's/a/b/' x\n")
          EOF
          if python3 /tmp/portable-copy/test/validate.py; then
            echo "ERROR: validator passed a workflow with non-portable in-place edits — that breaks the local runner on BSD"
            exit 1
          else
            echo "OK: validator keeps the negative self-tests portable"
          fi

      - name: Negative self-test (a shipped code-graph doctrine must reach the stage-9 gate)
        run: |
          set -eu
          cp -R . /tmp/graph-copy
          python3 - <<'EOF'
          import json, re
          p = "/tmp/graph-copy/plugins/task-pipeline/skills/task-pipeline/pipeline.example.json"
          d = json.load(open(p, encoding="utf-8"))
          for s in d["stages"]:
              if s.get("state") == "docs-wiki":
                  s["gate"]["check"] = re.sub(r"graph", "doc", s["gate"]["check"], flags=re.I)
          json.dump(d, open(p, "w", encoding="utf-8"), indent=2, ensure_ascii=False)
          EOF
          if python3 /tmp/graph-copy/test/validate.py; then
            echo "ERROR: validator passed a stage-9 gate that never mentions the graph — the refresh would be declared where it is not enforced"
            exit 1
          else
            echo "OK: validator requires the stage-9 gate to enforce the code-graph refresh"
          fi

      - name: Negative self-test (the stage-9 detail must name the code-graph refresh too)
        run: |
          set -eu
          cp -R . /tmp/graph-doc-copy
          python3 - <<'EOF'
          import re
          p = "/tmp/graph-doc-copy/plugins/task-pipeline/skills/task-pipeline/references/stages.md"
          t = open(p, encoding="utf-8").read()
          m = re.search(r"^## 9 — .*?(?=^## |\Z)", t, re.M | re.S)
          open(p, "w", encoding="utf-8").write(
              t[:m.start()] + re.sub(r"graph", "doc", m.group(0), flags=re.I) + t[m.end():])
          EOF
          if python3 /tmp/graph-doc-copy/test/validate.py; then
            echo "ERROR: validator passed a stage-9 section that never mentions the graph — an agent reading the stage detail is never told to refresh it"
            exit 1
          else
            echo "OK: validator requires stages.md stage 9 to name the code-graph refresh"
          fi

      - name: Negative self-test (the retrospective must reach the surfaces that enforce stage 10)
        run: |
          set -eu
          cp -R . /tmp/retro-anchor-copy
          python3 - <<'EOF'
          import re
          p = "/tmp/retro-anchor-copy/plugins/task-pipeline/skills/task-pipeline/references/acceptance.md"
          t = open(p, encoding="utf-8").read()
          open(p, "w", encoding="utf-8").write(re.sub(r"retro", "post", t, flags=re.I))
          EOF
          if python3 /tmp/retro-anchor-copy/test/validate.py; then
            echo "ERROR: validator passed a close-out doctrine that never mentions the retro — the rule would be declared in SKILL.md and enforced nowhere"
            exit 1
          else
            echo "OK: validator requires the retro to reach the stage-10 surfaces"
          fi

      - name: Negative self-test (the retro template must ship)
        run: |
          set -eu
          cp -R . /tmp/retro-tpl-copy
          rm -f /tmp/retro-tpl-copy/plugins/task-pipeline/skills/task-pipeline/templates/retro.md
          if python3 /tmp/retro-tpl-copy/test/validate.py; then
            echo "ERROR: validator passed with no retro template — the run has nowhere to write its lessons"
            exit 1
          else
            echo "OK: validator requires the retro template"
          fi

      - name: Negative self-test (a standing instruction must carry its retirement trigger)
        run: |
          set -eu
          cp -R . /tmp/retro-prune-copy
          python3 - <<'EOF'
          p = "/tmp/retro-prune-copy/plugins/task-pipeline/skills/task-pipeline/templates/retro.md"
          t = open(p, encoding="utf-8").read()
          open(p, "w", encoding="utf-8").write(t.replace("Retire when", "Notes"))
          EOF
          if python3 /tmp/retro-prune-copy/test/validate.py; then
            echo "ERROR: validator passed a retro template with no retirement trigger — the prune becomes an argument and the list grows until nobody reads it"
            exit 1
          else
            echo "OK: validator requires every standing instruction to carry its retire-when trigger"
          fi

      - name: Negative self-test (a task-pipeline:<name> skill must resolve to its doctrine file)
        run: |
          set -eu
          cp -R . /tmp/doctrine-ptr-copy
          python3 - <<'EOF'
          p = "/tmp/doctrine-ptr-copy/plugins/task-pipeline/skills/task-pipeline/pipeline.example.json"
          t = open(p, encoding="utf-8").read()
          open(p, "w", encoding="utf-8").write(
              t.replace('"task-pipeline:grill"', '"task-pipeline:interrogation"'))
          EOF
          if python3 /tmp/doctrine-ptr-copy/test/validate.py; then
            echo "ERROR: validator passed a stage pointed at doctrine that does not exist"
            exit 1
          else
            echo "OK: validator requires every task-pipeline:<name> to resolve to references/<name>.md"
          fi

      - name: Negative self-test (an unresolved merge conflict must fail)
        run: |
          set -eu
          cp -R . /tmp/conflict-copy
          python3 - <<'EOF'
          # build the markers at runtime — spelling them here would trip the guard
          # on this very file
          o, c, s = "<" * 7, ">" * 7, "=" * 7
          p = "/tmp/conflict-copy/README.md"
          t = open(p, encoding="utf-8").read()
          open(p, "w", encoding="utf-8").write(
              t + f"\n{o} HEAD\nours\n{s}\ntheirs\n{c} branch\n")
          EOF
          if python3 /tmp/conflict-copy/test/validate.py; then
            echo "ERROR: validator passed a file with unresolved conflict markers — in a prose repo that ships as doctrine"
            exit 1
          else
            echo "OK: validator rejects unresolved merge conflict markers"
          fi

      - name: Negative self-test (the documentation-track doctrine must ship)
        run: |
          set -eu
          for f in documentation gates hooks; do
            rm -rf /tmp/doctrine-copy
            cp -R . /tmp/doctrine-copy
            rm /tmp/doctrine-copy/plugins/task-pipeline/skills/task-pipeline/references/$f.md
            if python3 /tmp/doctrine-copy/test/validate.py; then
              echo "ERROR: validator passed with references/$f.md missing"
              exit 1
            fi
          done
          echo "OK: validator requires documentation.md, gates.md and hooks.md"

      - name: Negative self-test (the doc map must carry its propagation matrix)
        run: |
          set -eu
          rm -rf /tmp/docmap-copy && cp -R . /tmp/docmap-copy
          python3 - <<'EOF'
          p = "/tmp/docmap-copy/plugins/task-pipeline/skills/task-pipeline/templates/docmap.md"
          t = open(p, encoding="utf-8").read()
          assert "## Propagation matrix" in t, "PLANT MISSED"
          open(p, "w", encoding="utf-8").write(t.replace("## Propagation matrix", "## What changes what", 1))
          EOF
          if python3 /tmp/docmap-copy/test/validate.py; then
            echo "ERROR: validator passed a doc map with no propagation matrix — that seeds a project with a register and no obligation"
            exit 1
          else
            echo "OK: validator requires the doc map's propagation matrix"
          fi

      - name: Negative self-test (a retro lesson must carry its commit)
        run: |
          set -eu
          rm -rf /tmp/retrocommit-copy && cp -R . /tmp/retrocommit-copy
          python3 - <<'EOF'
          p = "/tmp/retrocommit-copy/plugins/task-pipeline/skills/task-pipeline/templates/retro.md"
          t = open(p, encoding="utf-8").read()
          assert "Commit" in t, "PLANT MISSED"
          open(p, "w", encoding="utf-8").write(t.replace("Commit", "Ref"))
          EOF
          if python3 /tmp/retrocommit-copy/test/validate.py; then
            echo "ERROR: validator passed a retro with no Commit column — file:line evidence rots at the next edit"
            exit 1
          else
            echo "OK: validator requires the retro's commit columns"
          fi

      - name: Negative self-test (the retro archive template must ship)
        run: |
          set -eu
          rm -rf /tmp/retroarch-copy && cp -R . /tmp/retroarch-copy
          rm /tmp/retroarch-copy/plugins/task-pipeline/skills/task-pipeline/templates/retro-archive.md
          if python3 /tmp/retroarch-copy/test/validate.py; then
            echo "ERROR: validator passed with no archive template — the in-force retro is capped and read in full, so its history needs a home"
            exit 1
          else
            echo "OK: validator requires templates/retro-archive.md"
          fi

      - name: Negative self-test (the seeded gate must stay portable)
        run: |
          set -eu
          rm -rf /tmp/portable-copy && cp -R . /tmp/portable-copy
          python3 - <<'EOF'
          p = "/tmp/portable-copy/plugins/task-pipeline/skills/task-pipeline/templates/docgate.sh"
          t = open(p, encoding="utf-8").read()
          # Build the construct at runtime — spelling it here would trip the
          # workflow's own portability guard on this very file.
          bad = "s" + "ed -" + "i 's/a/b/' /dev/null"
          # plant in CODE, not in a comment: the guard reads code only
          assert "set -u" in t, "PLANT MISSED"
          open(p, "w", encoding="utf-8").write(t.replace("set -u", "set -u\n" + bad, 1))
          EOF
          if python3 /tmp/portable-copy/test/validate.py; then
            echo "ERROR: validator passed a gate using an in-place stream edit — on BSD it silently edits nothing and reads as a guard that failed to fire"
            exit 1
          else
            echo "OK: validator rejects non-portable constructs in the seeded gate"
          fi

      - name: Negative self-test (the seeded gate must seed GREEN)
        run: |
          set -eu
          rm -rf /tmp/seedred-copy && cp -R . /tmp/seedred-copy
          python3 - <<'EOF'
          p = "/tmp/seedred-copy/plugins/task-pipeline/skills/task-pipeline/templates/decisions.md"
          t = open(p, encoding="utf-8").read()
          old = "**Next free ID:** `DEC-0002`"
          assert old in t, "PLANT MISSED"
          open(p, "w", encoding="utf-8").write(t.replace(old, "**Next free ID:** `DEC-0009`", 1))
          EOF
          if python3 /tmp/seedred-copy/test/validate.py; then
            echo "ERROR: validator passed templates whose own gate rejects them — a project that starts red learns on day one that the gate is noise"
            exit 1
          else
            echo "OK: validator runs the seeded gate over a seeded project and requires exit 0"
          fi

      - name: Negative self-test (every template must be listed in templates/README.md)
        run: |
          set -eu
          rm -rf /tmp/tplreadme-copy && cp -R . /tmp/tplreadme-copy
          echo "# stray" > /tmp/tplreadme-copy/plugins/task-pipeline/skills/task-pipeline/templates/unlisted.md
          if python3 /tmp/tplreadme-copy/test/validate.py; then
            echo "ERROR: validator passed an unlisted template — one nobody knows to seed"
            exit 1
          else
            echo "OK: validator requires templates/README.md to list every template"
          fi

      - name: Negative self-test (the doc track must reach the surfaces that enforce it)
        run: |
          set -eu
          rm -rf /tmp/anchor-copy && cp -R . /tmp/anchor-copy
          python3 - <<'EOF'
          import re
          p = "/tmp/anchor-copy/plugins/task-pipeline/skills/task-pipeline/references/stages.md"
          t = open(p, encoding="utf-8").read()
          assert re.search("propagation", t, re.I), "PLANT MISSED"
          open(p, "w", encoding="utf-8").write(re.sub("propagation", "spreading", t, flags=re.I))
          EOF
          if python3 /tmp/anchor-copy/test/validate.py; then
            echo "ERROR: validator passed with the propagation sweep declared in SKILL.md and absent from stages.md — declared where it is not enforced is inert"
            exit 1
          else
            echo "OK: validator holds every surface that enforces stage 9 to the propagation sweep"
          fi

      - name: Negative self-test (the two decision shapes must agree on fields)
        run: |
          set -eu
          rm -rf /tmp/adrparity-copy && cp -R . /tmp/adrparity-copy
          python3 - <<'EOF'
          p = "/tmp/adrparity-copy/plugins/task-pipeline/skills/task-pipeline/templates/adr.md"
          t = open(p, encoding="utf-8").read()
          assert "Consequences / affects" in t, "PLANT MISSED"
          open(p, "w", encoding="utf-8").write(t.replace("Consequences / affects", "Downstream effects"))
          EOF
          if python3 /tmp/adrparity-copy/test/validate.py; then
            echo "ERROR: validator passed a register and an ADR set that disagree on fields — two shapes of one contract is a fork with extra steps"
            exit 1
          else
            echo "OK: validator holds decisions.md and adr.md to one field set"
          fi

      - name: install.sh syntax check
        run: bash -n install.sh

      - name: Workflow YAML parses (validate + release)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/release.yml')); yaml.safe_load(open('.github/workflows/validate.yml')); print('workflows parse OK')"

      - name: npm installer CLI check
        run: node --check bin/task-pipeline.js

      - name: npm installer functional test (fresh / rerun-skip / --force)
        run: |
          set -eu
          export HOME=/tmp/fakehome
          mkdir -p "$HOME"
          node bin/task-pipeline.js
          test -f "$HOME/.claude/skills/task-pipeline/SKILL.md"
          test -f "$HOME/.claude/commands/task-pipeline.md"
          node bin/task-pipeline.js | grep -q '^skip:'
          node bin/task-pipeline.js --force | grep -q '^Installed'
          if node bin/task-pipeline.js --wat; then
            echo "ERROR: unknown arg accepted"; exit 1
          fi
          echo "OK: npm installer behaves"
      - name: Official Claude Code conformance (plugin + marketplace, strict)
        run: |
          set -eu
          # The repo's own validator enforces house rules; this one is the
          # upstream spec. --strict fails on unrecognized manifest fields and on
          # front matter that silently drops at runtime -- both were real here.
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
          claude plugin validate plugins/task-pipeline --strict
