name: validate

on:
  # B-101: `push:` with no filter re-validated a SHA that had already passed. Observed
  # 2026-08-17 releasing v1.69.0 — `validate` succeeded on `92fc3ea` at 14:15 and the tag
  # push started a second run on the same `92fc3ea` eleven minutes later, at ~38 minutes a
  # run. `tags-ignore` and not `paths-ignore`: the question is not which files changed, it
  # is the same commit being asked the same question twice. The release workflow still runs
  # the suite on its own tree, which is the run that proves what shipped.
  push:
    tags-ignore:
      - '**'
  pull_request:

jobs:
  validate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # the tag-ancestry check below needs history, not a shallow clone

      # A release that lives only on a tag is invisible from inside either record.
      # v1.4.4 was tagged, released and published with a manifest field that `main`
      # never received; every later branch was cut from a tree that had not seen it,
      # and v1.6.0 silently shipped without it. main was consistent with itself, the
      # tag was consistent with itself, CI was green on both — the disagreement only
      # existed BETWEEN them, which is the same shape as the parent/submodule pointer
      # this project's own stage-10 doctrine guards against. So: every released tag
      # must be reachable from main.
      - name: Every v* tag must be contained in main
        run: |
          set -eu
          # --force, and it is not defensive noise. On a TAG build, checkout has
          # already created refs/tags/<tag> locally; re-fetching an ANNOTATED tag
          # then aborts with "would clobber existing tag" and git exits 1 — before
          # this step prints a single line, so `set -e` kills it with no output and
          # the log shows only the echoed script. That is exactly how it read.
          # It failed on every tag from v1.6.1 (the first one cut with `git tag -a`)
          # while `release` went out green beside it, so nobody saw a thing.
          git fetch --tags --force --quiet || echo "note: tag fetch degraded, continuing"
          git fetch --quiet origin main:refs/remotes/origin/main || true
          # If origin/main cannot be resolved, EVERY tag looks like an orphan and the
          # step reports a catastrophe that is really a missing ref. Say which it is.
          if ! git rev-parse --verify --quiet refs/remotes/origin/main >/dev/null; then
            echo "ERROR: refs/remotes/origin/main could not be fetched — the ancestry"
            echo "check cannot run, and reporting every tag as an orphan would be a lie."
            exit 1
          fi
          echo "checking $(git tag --list 'v*' | wc -l | tr -d ' ') tag(s) against $(git rev-parse --short refs/remotes/origin/main)"
          orphans=""
          for t in $(git tag --list 'v*'); do
            if ! git merge-base --is-ancestor "$t" origin/main 2>/dev/null; then
              orphans="$orphans $t"
            fi
          done
          if [ -n "$orphans" ]; then
            echo "ERROR: released tag(s) not contained in main:$orphans"
            echo "A tag outside main is a release nobody can branch from — its changes"
            echo "vanish from the next version while the registry still serves them."
            echo "Fix: merge or cherry-pick the tagged commit into main, then re-tag."
            exit 1
          fi
          echo "OK: every v* tag is an ancestor of main"

      - name: Install jsonschema (enables full pipeline.example.json conformance pass)
        run: python3 -m pip install --quiet jsonschema

      - name: Structural validator
        run: python3 test/validate.py

      - name: The rest of the `npm test` equation (graph suite + shipped audit collector)
        # CLAUDE.md documents `npm test` as three suites; this job ran only the
        # first, so a PR breaking graph.py merged green and the defect surfaced
        # at tag time, one failure per 25-minute round (TP3-04).
        run: |
          python3 test/graph_test.py
          python3 test/project_audit_test.py
          python3 test/packet_schema_test.py
          python3 test/browser_claims_test.py
          python3 test/visual_gate_test.py
          python3 test/stage_checkpoint_test.py

      - name: Audit regressions (sherlock plan, one file per closed finding)
        run: npm run test:audit-regressions

      - name: Stage-7 release gate (the hook this skill ships)
        run: python3 test/release_gate_test.py

      - name: The artifact-root rule (two implementations, one table, compared)
        run: python3 test/artifact_root_test.py

      - name: migrate-artifacts, proven at the layer that repeats (three real runs)
        run: python3 test/migrate_artifacts_test.py

      - name: install.sh syntax check
        run: bash -n install.sh

      - name: Workflow YAML parses (validate + release)
        run: |
          python3 -m pip install --quiet pyyaml
          python3 -c "import yaml; yaml.safe_load(open('.github/workflows/release.yml')); yaml.safe_load(open('.github/workflows/validate.yml')); print('workflows parse OK')"

      - name: npm installer CLI check
        run: node --check bin/task-pipeline.js

      - name: npm installer functional test (fresh / rerun-skip / --force)
        run: |
          set -eu
          export HOME=/tmp/fakehome
          mkdir -p "$HOME"
          node bin/task-pipeline.js
          test -f "$HOME/.claude/skills/task-pipeline/SKILL.md"
          test -f "$HOME/.claude/commands/task-pipeline.md"
          node bin/task-pipeline.js | grep -q '^skip:'
          node bin/task-pipeline.js --force | grep -q '^Installed'
          if node bin/task-pipeline.js --wat; then
            echo "ERROR: unknown arg accepted"; exit 1
          fi
          echo "OK: npm installer behaves"
      - name: Positive control (claim registry — a QUOTED stale number is a citation, not a claim)
        run: |
          set -eu
          rm -rf /tmp/cr3-copy && cp -R . /tmp/cr3-copy
          python3 - <<'EOF'
          p = "/tmp/cr3-copy/README.md"
          t = open(p, encoding="utf-8").read()
          anchor = "## Contributing"
          assert anchor in t, "PLANT DID NOT LAND: anchor absent before edit"
          t = t.replace(anchor, 'It once said "15 rules earned by failure" and was wrong.\n\n' + anchor, 1)
          open(p, "w", encoding="utf-8").write(t)
          assert '"15 rules earned by failure"' in open(p, encoding="utf-8").read(), "PLANT DID NOT LAND"
          EOF
          if python3 /tmp/cr3-copy/test/validate.py; then
            echo "OK: validator correctly PASSES — a quoted number is a citation of what a document said"
          else
            echo "ERROR: the registry rejected a quoted citation; documents cannot narrate their own drift"
            exit 1
          fi

      - name: Positive control (claim registry — a citation split by the repo's ~80-char wrap)
        run: |
          set -eu
          rm -rf /tmp/cr8-copy && cp -R . /tmp/cr8-copy
          python3 - <<'EOF'
          p = "/tmp/cr8-copy/README.md"
          t = open(p, encoding="utf-8").read()
          anchor = "## Contributing"
          assert anchor in t, "PLANT DID NOT LAND: anchor absent before edit"
          cite = 'It used to say "fifteen rules earned by failure on a real multi-repository\nbuild" and that was wrong.\n\n'
          open(p, "w", encoding="utf-8").write(t.replace(anchor, cite + anchor, 1))
          assert "multi-repository\nbuild\"" in open(p, encoding="utf-8").read(), "PLANT DID NOT LAND"
          EOF
          if python3 /tmp/cr8-copy/test/validate.py; then
            echo "OK: validator correctly PASSES — a quotation stays a quotation across a line break"
          else
            echo "ERROR: the quote exemption is per-line again; this corpus wraps at ~80 characters"
            exit 1
          fi

      - name: Exposure suite (the measurement that must not become a score)
        run: python3 test/exposure_test.py

  negatives:
    # Every guard watched rejecting a planted defect. The checks are files under
    # `test/negatives/`, one each, run by `test/negatives.py`. Until v1.93.0 they were
    # 448 inline steps of the validate job: 507,836 of GitHub's 512,000 bytes (past
    # the limit a workflow creates no runs and reports nothing) and 90-111 minutes in
    # one job. Each shard is its own runner, so the fixed `/tmp/<name>-copy` scratch
    # names never meet. fail-fast is off: one red shard must not cancel the evidence
    # the other seven would have produced. `test/validate.py` refuses a matrix that
    # does not list every shard the runner is told to cut.
    name: Negative self-tests (shard ${{ matrix.shard }} of 8)
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        shard: [1, 2, 3, 4, 5, 6, 7, 8]
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0   # plants read history: tag ancestry, a file's earlier values

      - name: The refs the plants read (tags and origin/main, as the validate job fetches them)
        run: |
          git fetch --tags --force --quiet || echo "note: tag fetch degraded, continuing"
          git fetch --quiet origin main:refs/remotes/origin/main || true

      - name: Dependencies the validator and the plants need
        run: python3 -m pip install --quiet jsonschema pyyaml

      - name: Negative self-tests and property checks, one shard
        run: python3 test/negatives.py --shard ${{ matrix.shard }}/8

  negatives-all:
    # One status for the eight shards, so the branch ruleset can require it: a matrix
    # job reports eight contexts, and none of them was in main's required set, so a red
    # shard did not block a merge (wave 2 seam reading). `always()` makes a failed or
    # cancelled shard a failure here instead of a skip.
    name: Negative self-tests
    needs: negatives
    if: always()
    runs-on: ubuntu-latest
    steps:
      - name: Every shard passed
        run: test "${{ needs.negatives.result }}" = success

  plugin-conformance:
    # Split out of `validate` (TPA-09): this job's first act is an npm install
    # of the upstream CLI, so a registry outage failed the whole house suite —
    # and a house failure hid whether the upstream spec still passed. Separate
    # jobs fail separately, and each red means one thing.
    name: Official Claude Code conformance (strict)
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - name: Official Claude Code conformance (plugin + marketplace, strict)
        run: |
          set -eu
          # The repo's own validator enforces house rules; this one is the
          # upstream spec. --strict fails on unrecognized manifest fields and on
          # front matter that silently drops at runtime -- both were real here.
          npm install -g @anthropic-ai/claude-code
          claude plugin validate . --strict
          claude plugin validate plugins/task-pipeline --strict

  skill-audit:
    name: House skill audit
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkout the pinned family auditor
        uses: actions/checkout@v4
        with:
          repository: ssheleg/make-skill
          ref: 5ca5c367ba24295d4dd99ff670dbef97234140e7
          path: .skill-auditor
          persist-credentials: false

      - name: Install a real tokenizer (the budget is MEASURED, never estimated)
        run: python3 -m pip install --quiet tiktoken

      - name: Audit every shipped Agent Skill
        run: |
          python3 - <<'PY'
          from pathlib import Path
          import subprocess
          import sys

          auditor = Path(".skill-auditor/plugins/make-skill/skills/make-skill/scripts/audit_skill.py")
          skills = sorted({
              *Path(".").glob("plugins/*/skills/*/SKILL.md"),
              *Path(".").glob("skills/*/SKILL.md"),
          })
          if not skills:
              raise SystemExit("no shipped SKILL.md found")
          for manifest in skills:
              subprocess.run(
                  [sys.executable, str(auditor), "--house", str(manifest.parent)],
                  check=True,
              )
          print(f"OK: {len(skills)} shipped skill(s) passed the pinned house audit")
          PY

      - name: Validate behavioral eval data and watch the guard fail
        run: |
          python3 test/evals_validate.py
          python3 test/evals_validate.py --self-test

      - name: Validate the committed social preview
        run: python3 test/social_preview.py
